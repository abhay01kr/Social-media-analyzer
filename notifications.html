<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - Social Media Analyzer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="sidebar.css">
  <link rel="stylesheet" href="notifications.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="logo" onclick="window.location.href='home.html'"><i class="fa-solid fa-brain"></i></div>
      <div class="nav-icon" onclick="window.location.href='dashboard.html'" title="Dashboard"><i class="fa-solid fa-chart-simple"></i></div>
      <div class="nav-icon" onclick="window.location.href='analyzer.html'" title="Analyzer"><i class="fa-solid fa-magnifying-glass-chart"></i></div>
      <div class="nav-icon" onclick="window.location.href='history.html'" title="History"><i class="fa-solid fa-clock-rotate-left"></i></div>
      <div class="nav-icon active" onclick="window.location.href='notifications.html'" title="Notifications"><i class="fa-solid fa-bell"></i></div>
      <div class="nav-icon" onclick="window.location.href='settings.html'" title="Settings"><i class="fa-solid fa-gear"></i></div>
      <div class="nav-icon logout-icon" onclick="window.location.href='logout.html'" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="header-container">
        <div class="header-left">
          <h2>Notifications</h2>
          <span id="unread-count-badge" class="unread-count">2 New</span>
        </div>
        <button class="mark-read-btn" onclick="markAllAsRead()">
          <i class="fa-solid fa-check-double"></i> Mark All as Read
        </button>
      </div>

      <!-- Navigation Tabs -->
      <div class="notifications-tabs">
        <button class="tab-btn active" onclick="filterNotifications('all')">All</button>
        <button class="tab-btn" onclick="filterNotifications('unread')">Unread</button>
        <button class="tab-btn" onclick="filterNotifications('updates')">Updates</button>
        <button class="tab-btn" onclick="filterNotifications('system')">System</button>
      </div>

      <!-- Notification List -->
      <div class="notifications-list" id="notifications-container">
        <!-- Rendered via Javascript -->
      </div>
    </div>
  </div>

  <script>
    // Initial default notifications list
    const defaultNotifications = [
      {
        id: "1",
        type: "updates",
        icon: "fa-video",
        title: "Your video analysis is complete",
        description: "video.mp4 has been analyzed. Score: 92% Authentic.",
        date: "2m ago",
        unread: true
      },
      {
        id: "2",
        type: "system",
        icon: "fa-shield-halved",
        title: "New login detected",
        description: "A new login was detected from Chrome on Windows.",
        date: "1h ago",
        unread: true
      },
      {
        id: "3",
        type: "updates",
        icon: "fa-user-check",
        title: "Profile analysis complete",
        description: "@username profile analysis is complete. Score: 85% Trusted.",
        date: "2h ago",
        unread: false
      },
      {
        id: "4",
        type: "updates",
        icon: "fa-file-invoice",
        title: "Report generated",
        description: "Your report #SMA1248 is ready to download.",
        date: "3h ago",
        unread: false
      },
      {
        id: "5",
        type: "system",
        icon: "fa-credit-card",
        title: "Subscription updated",
        description: "Your subscription has been renewed successfully.",
        date: "1d ago",
        unread: false
      }
    ];

    // Load or initialize notifications
    function getNotifications() {
      const stored = localStorage.getItem("sma_notifications");
      if (stored) {
        try {
          return JSON.parse(stored);
        } catch(e) {
          return defaultNotifications;
        }
      } else {
        localStorage.setItem("sma_notifications", JSON.stringify(defaultNotifications));
        return defaultNotifications;
      }
    }

    let activeFilter = 'all';

    function renderNotifications() {
      const list = getNotifications();
      const container = document.getElementById("notifications-container");
      
      // Filter list
      const filtered = list.filter(item => {
        if (activeFilter === 'all') return true;
        if (activeFilter === 'unread') return item.unread;
        return item.type === activeFilter;
      });

      container.innerHTML = "";

      // Update badge
      const unreadCount = list.filter(item => item.unread).length;
      const badge = document.getElementById("unread-count-badge");
      if (unreadCount > 0) {
        badge.textContent = `${unreadCount} New`;
        badge.style.display = "inline-block";
      } else {
        badge.style.display = "none";
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fa-regular fa-bell-slash empty-icon"></i>
            <h4>All Caught Up!</h4>
            <p>You have no notifications in this section.</p>
          </div>
        `;
        return;
      }

      filtered.forEach(item => {
        const div = document.createElement("div");
        div.className = `notification-item ${item.unread ? 'unread' : ''}`;
        div.onclick = () => toggleReadStatus(item.id);

        div.innerHTML = `
          <div class="icon-circle">
            <i class="fa-solid ${item.icon}"></i>
          </div>
          <div class="notification-body">
            <h4>${escapeHTML(item.title)}</h4>
            <p>${escapeHTML(item.description)}</p>
          </div>
          <div class="notification-meta">
            <span class="time">${item.date}</span>
            ${item.unread ? '<span class="unread-dot"></span>' : ''}
          </div>
        `;

        container.appendChild(div);
      });
    }

    function toggleReadStatus(id) {
      const list = getNotifications();
      const item = list.find(n => n.id === id);
      if (item) {
        item.unread = !item.unread;
        localStorage.setItem("sma_notifications", JSON.stringify(list));
        renderNotifications();
      }
    }

    function markAllAsRead() {
      const list = getNotifications();
      list.forEach(n => n.unread = false);
      localStorage.setItem("sma_notifications", JSON.stringify(list));
      renderNotifications();
    }

    function filterNotifications(filterType) {
      activeFilter = filterType;
      
      const buttons = document.querySelectorAll(".tab-btn");
      buttons.forEach(btn => btn.classList.remove("active"));
      event.target.classList.add("active");
      
      renderNotifications();
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }

    // Load and render
    document.addEventListener("DOMContentLoaded", () => {
      if (localStorage.getItem("pref_dark_mode") === "true") {
        document.body.classList.add("dark-mode");
      }
      renderNotifications();
    });
  </script>

</body>
</html>
